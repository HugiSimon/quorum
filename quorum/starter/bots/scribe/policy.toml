# Writes, never runs. A write outside the room folder still comes up to the user.
# First matching rule wins, decreasing priority.

[[rules]]
toolName = "run_shell_command"
decision = "deny"
priority = 90
denyMessage = "@scribe writes, it does not run — ask @forge"

[[rules]]
toolName = "write_file"
decision = "allow"
priority = 50

[[rules]]
toolName = "replace"
decision = "allow"
priority = 50

[[rules]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rules]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rules]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rules]]
toolName = "glob"
decision = "allow"
priority = 50

[[rules]]
decision = "ask_user"
priority = 1
