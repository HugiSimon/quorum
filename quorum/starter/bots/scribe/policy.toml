# Writes, never runs. A write outside the room folder still comes up to the user.
# First matching rule wins, decreasing priority.

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 90
# refused with: @scribe writes, it does not run

[[rule]]
toolName = "write_file"
decision = "allow"
priority = 50

[[rule]]
toolName = "replace"
decision = "allow"
priority = 50

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rule]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rule]]
toolName = "glob"
decision = "allow"
priority = 50

[[rule]]
toolName = "*"
decision = "ask_user"
priority = 1
