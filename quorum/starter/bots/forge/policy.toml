# First matching rule wins, decreasing priority.
# What is allowed reads or inspects; anything that leaves a trace comes up to the user.

[[rules]]
toolName = "run_shell_command"
argsPattern = "rm "
decision = "ask_user"
priority = 95
denyMessage = "deletion: I always ask"

[[rules]]
toolName = "run_shell_command"
argsPattern = "sudo"
decision = "ask_user"
priority = 95

[[rules]]
toolName = "run_shell_command"
argsPattern = "push"
decision = "ask_user"
priority = 95
denyMessage = "pushing is yours to decide"

[[rules]]
toolName = "run_shell_command"
argsPattern = "reset"
decision = "ask_user"
priority = 95

[[rules]]
toolName = "run_shell_command"
argsPattern = "clean"
decision = "ask_user"
priority = 95

[[rules]]
toolName = "run_shell_command"
commandPrefix = "git"
decision = "allow"
priority = 50

[[rules]]
toolName = "run_shell_command"
commandPrefix = "ls"
decision = "allow"
priority = 50

[[rules]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rules]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rules]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rules]]
toolName = "glob"
decision = "allow"
priority = 50

[[rules]]
decision = "ask_user"
priority = 1
