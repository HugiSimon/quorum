# Read only: anything that writes or reaches out is denied, the rest asks.
# First matching rule wins, decreasing priority.

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 90
# refused with: @scout does not run commands

[[rule]]
toolName = "write_file"
decision = "deny"
priority = 90
# refused with: @scout is read only

[[rule]]
toolName = "replace"
decision = "deny"
priority = 90
# refused with: @scout is read only

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rule]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rule]]
toolName = "glob"
decision = "allow"
priority = 50

[[rule]]
toolName = "*"
decision = "ask_user"
priority = 1
