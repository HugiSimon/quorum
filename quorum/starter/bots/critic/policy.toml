# Read only: a reviewer that could change the code would be judging its own work.
# First matching rule wins, decreasing priority.

[[rules]]
toolName = "run_shell_command"
decision = "deny"
priority = 90
denyMessage = "@critic reviews, it does not run"

[[rules]]
toolName = "write_file"
decision = "deny"
priority = 90
denyMessage = "@critic is read only"

[[rules]]
toolName = "replace"
decision = "deny"
priority = 90
denyMessage = "@critic is read only"

[[rules]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rules]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rules]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rules]]
toolName = "glob"
decision = "allow"
priority = 50

[[rules]]
decision = "ask_user"
priority = 1
