[project]
name = "quorum"
version = "0.1.0"
description = "Une salle, plusieurs agents, un seul fil."
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
quorum = "quorum.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quorum"]
