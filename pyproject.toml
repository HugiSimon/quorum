[project]
name = "quorum"
version = "0.1.0"
description = "One room, several agents, a single thread."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["textual>=1.0"]

[project.scripts]
quorum = "quorum.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quorum"]
