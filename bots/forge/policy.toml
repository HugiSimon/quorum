# First matching rule wins, decreasing priority.

[[rules]]
toolName = "run_shell_command"
argsPattern = "rm "
decision = "ask_user"
priority = 90
denyMessage = "deletion: I always ask"

[[rules]]
toolName = "run_shell_command"
commandPrefix = "git"
decision = "allow"
priority = 50

[[rules]]
toolName = "run_shell_command"
commandPrefix = "ls"
decision = "allow"
priority = 50

[[rules]]
decision = "ask_user"
priority = 1
