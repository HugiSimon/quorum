name = "forge"
role = "execution"
hue = 150

command = "gemini"
args = ["--acp"]
model = ""           # empty: we leave the provider's default

# Anything machine-specific goes through here, never through the code.
[env]
NODE_EXTRA_CA_CERTS = "${NODE_EXTRA_CA_CERTS}"
HTTPS_PROXY = "${HTTPS_PROXY}"
NO_PROXY = "${NO_PROXY}"
