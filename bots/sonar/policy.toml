# Lecture seule : tout ce qui écrit ou sort est interdit, le reste demande.

[[rules]]
toolName = "run_shell_command"
decision = "deny"
priority = 90
denyMessage = "@sonar ne lance pas de commandes — demande à @forge"

[[rules]]
toolName = "write_file"
decision = "deny"
priority = 90
denyMessage = "@sonar est en lecture seule"

[[rules]]
toolName = "replace"
decision = "deny"
priority = 90
denyMessage = "@sonar est en lecture seule"

[[rules]]
toolName = "read_file"
decision = "allow"
priority = 50

[[rules]]
toolName = "list_directory"
decision = "allow"
priority = 50

[[rules]]
toolName = "search_file_content"
decision = "allow"
priority = 50

[[rules]]
toolName = "glob"
decision = "allow"
priority = 50

[[rules]]
decision = "ask_user"
priority = 1
